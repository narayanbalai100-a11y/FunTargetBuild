Name: Build Cordova Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repo  
        uses: actions/checkout@v4  

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Install Dependencies
        run: |
          # यह सुनिश्चित करता है कि आपके प्रोजेक्ट के सभी जरूरी पैकेज मौजूद हैं
          npm install

      - name: Install Cordova  
        run: npm install -g cordova  

      - name: Install Java  
        uses: actions/setup-java@v4  
        with:  
          distribution: "temurin"  
          java-version: "17"  

      - name: Install Android SDK  
        uses: android-actions/setup-android@v3  

      - name: Prepare Assets
        run: |
          # यह स्टेप सुनिश्चित करता है कि आपकी सभी इमेजेस, HTML और सब-फोल्डर्स तैयार हैं
          # हम 'cordova prepare' का उपयोग करेंगे जो www फोल्डर की हर चीज को प्लेटफार्म में सिंक करता है
          cordova prepare android

      - name: Add Android Platform  
        run: |  
          # अगर पहले से कोई प्लेटफार्म फोल्डर है तो उसे क्लीन करके नया बनाएंगे
          # ताकि कोई पुरानी फाइल बिल्ड में रुकावट न डाले
          cordova platform remove android --nosave || true
          cordova platform add android  

      - name: Build Debug APK  
        run: |  
          # 'Full Build' के लिए हम इसे रन कर रहे हैं
          # यह आपके सभी सब-फोल्डर्स (HTML, CSS, JS, Images) को APK में पैक कर देगा
          cordova build android --debug  

      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: FunTarget-APK  
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
