name: FunTargetPro Android Build (SIGNED APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova

      # ✅ IMPORTANT: project folder set karo
      - name: Install NPM Dependencies
        run: npm install
        working-directory: FunTargetPro

      - name: Add Android Platform
        run: cordova platform add android@10.1.2
        working-directory: FunTargetPro

      - name: Build Unsigned Release APK
        run: cordova build android --release
        working-directory: FunTargetPro

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > funtarget.jks
        working-directory: FunTargetPro

      - name: Sign APK
        run: |
          APK_PATH=$(find platforms/android/app/build/outputs/apk/release/ -name "*-unsigned.apk" | head -n 1)
          echo "Unsigned APK: $APK_PATH"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools: $BUILD_TOOLS"

          $BUILD_TOOLS/apksigner sign \
            --ks funtarget.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --out FunTargetPro_Final_Signed.apk \
            "$APK_PATH"
        working-directory: FunTargetPro

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FunTargetPro-SIGNED-APK
          path: FunTargetPro/FunTargetPro_Final_Signed.apk
