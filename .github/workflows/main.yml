name: FunTargetPro Android Build (SIGNED APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install NPM Dependencies
        run: npm install

      - name: Add Android Platform
        run: cordova platform add android@10.1.2

      - name: Build Unsigned Release APK
        run: cordova build android --release

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > funtarget.jks

      - name: Sign APK
        run: |
          APK_PATH=$(find platforms/android/app/build/outputs/apk/release/ -name "*-unsigned.apk" | head -n 1)
          echo "Unsigned APK: $APK_PATH"

          $ANDROID_HOME/build-tools/33.0.2/apksigner sign \
            --ks funtarget.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --out FunTargetPro_Final_Signed.apk \
            "$APK_PATH"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FunTargetPro-SIGNED-APK
          path: FunTargetPro_Final_Signed.apk
