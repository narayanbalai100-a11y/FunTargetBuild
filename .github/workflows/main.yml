Name: Build Cordova Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repo  
        uses: actions/checkout@v4  

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Install Project Dependencies
        run: |
          npm install
          # यह पक्का करता है कि आपके सभी जरूरी फोल्डर्स और प्लगइन्स मौजूद हैं।

      - name: Install Cordova  
        run: npm install -g cordova  

      - name: Install Java  
        uses: actions/setup-java@v4  
        with:  
          distribution: "temurin"  
          java-version: "17"  

      - name: Install Android SDK  
        uses: android-actions/setup-android@v3  

      - name: Sync Resources and Assets
        run: |
          # यह स्टेप आपके www फोल्डर की हर इमेज, HTML और सब-फोल्डर को 
          # Android प्लेटफार्म में कॉपी करता है ताकि एपीके अधूरा न रहे।
          cordova prepare android

      - name: Add Android Platform  
        run: |  
          cordova platform add android  

      - name: Build Debug APK  
        run: |  
          # यहाँ आपका कंप्लीट एपीके (Complete APK) बनेगा
          cordova build android --debug  

      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: FunTarget-APK  
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
