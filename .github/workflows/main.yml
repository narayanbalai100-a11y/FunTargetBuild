Name: Build Cordova Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repo  
        uses: actions/checkout@v4  
        # यह आपके कोड के सभी फोल्डर्स और फाइलों को GitHub से लाता है

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Install Project Dependencies
        run: |
          npm install
          # यह पक्का करता है कि आपके प्रोजेक्ट के अंदर के सभी प्लगइन्स और जरूरी फोल्डर्स मौजूद हैं।

      - name: Install Cordova  
        run: npm install -g cordova  

      - name: Install Java  
        uses: actions/setup-java@v4  
        with:  
          distribution: "temurin"  
          java-version: "17"  

      - name: Install Android SDK  
        uses: android-actions/setup-android@v3  

      - name: Add Android Platform  
        run: |  
          # अगर प्लेटफार्म पहले से है तो उसे रिफ्रेश करता है ताकि सब कुछ नया बिल्ड हो
          cordova platform remove android --nosave || true
          cordova platform add android  

      - name: Prepare Resources and Folders
        run: |
          # यह सबसे जरूरी स्टेप है। यह आपके 'www' फोल्डर के अंदर के 
          # सभी 'ब्लू फोल्डर्स', इमेजेस और HTML फाइल्स को एंड्रॉइड एसेट्स में सिंक करता है।
          cordova prepare android

      - name: Build Debug APK  
        run: |  
          # यहाँ आपका कंप्लीट एपीके (Complete APK) बनकर तैयार होगा
          # इसमें आपकी हर एक फाइल शामिल होगी।
          cordova build android --debug  

      - name: Provide APK to User
        uses: actions/upload-artifact@v4  
        with:  
          name: FunTarget-Complete-APK  
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          # यह स्टेप आपको GitHub Actions के 'Summary' टैब में डाउनलोड करने के लिए एपीके देगा।
