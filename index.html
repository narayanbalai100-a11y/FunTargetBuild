<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FunTarget Professional</title>
<style>
    /* ======================================================= */
    /* 1. CLEAN UI - NO LOADER STYLES */
    /* ======================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body, html { 
        height: 100%; width: 100%; overflow: hidden; 
        background-color: #000; /* लोडर की जगह काली स्क्रीन दिखेगी जो तुरंत गेम में बदल जाएगी */
        color: #fff; font-family: sans-serif;
    }

    .game-container {
        width: 100%; height: 100%;
        background: url('https://uploads.onecompiler.io/445tyzay6/447r6atw6/1000052793.jpg') no-repeat center center;
        background-size: cover;
        display: flex; flex-direction: column; align-items: center;
        position: relative;
    }

    /* Top Stats */
    .header { width: 100%; display: flex; justify-content: space-between; padding: 10px 20px; }
    .stat-box { background: rgba(0,0,0,0.7); border: 2px solid #ffd36a; border-radius: 8px; width: 180px; text-align: center; }
    .stat-label { color: #ffd36a; font-size: 14px; font-weight: bold; }
    .stat-value { background: linear-gradient(to bottom, #fff3b1, #ffd36a); color: #000; font-size: 24px; font-weight: 800; border-radius: 4px; margin: 2px; }

    /* ======================================================= */
    /* 2. CENTRAL WHEEL & SPIN BUTTON (AS PER IMAGE) */
    /* ======================================================= */
    .wheel-area { position: relative; margin-top: 20px; width: 360px; height: 360px; }
    
    canvas#wheel { width: 100%; height: 100%; }

    /* आपकी इमेज वाला "SPIN" बटन */
    .center-button {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 100px; height: 100px; border-radius: 50%;
        background: radial-gradient(circle, #fff3b1, #ffd36a, #b38b00);
        border: 4px solid #5c4400;
        display: flex; align-items: center; justify-content: center;
        color: #000; font-weight: 900; font-size: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.5);
        z-index: 100; cursor: pointer;
    }

    /* ======================================================= */
    /* 3. CHIPS & CONTROLS */
    /* ======================================================= */
    .controls { width: 100%; position: absolute; bottom: 20px; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
    
    .chip-row { display: flex; gap: 8px; }
    .chip { 
        width: 50px; height: 50px; border-radius: 50%; border: 3px solid #fff;
        display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;
    }
    .chip.green { background: #2d6a4f; }
    .chip.blue { background: #1d3557; }
    .chip.red { background: #a4161a; }
    .chip.purple { background: #5a189a; }
    .chip.gold { background: #b38b00; border-color: #ffd36a; }

    .action-btn { background: #a4161a; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    .action-btn.all { background: #1d3557; }

</style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="stat-box">
            <div class="stat-label">Coins</div>
            <div id="coins" class="stat-value">300.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Winner</div>
            <div id="winner" class="stat-value">0</div>
        </div>
    </div>

    <div class="stat-box" style="margin-top: 10px; width: 140px;">
        <div class="stat-label">Time</div>
        <div id="time" class="stat-value">46</div>
    </div>

    <div class="wheel-area">
        <div class="center-button" onclick="startSpin()">SPIN</div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button class="action-btn">Specific</button>
        <div class="chip-row">
            <div class="chip green">1</div>
            <div class="chip blue">5</div>
            <div class="chip red">10</div>
            <div class="chip purple">500</div>
            <div class="chip gold">1000</div>
        </div>
        <button class="action-btn all">All</button>
    </div>
</div>

<script>
    // लोडर हटाने के लिए हमने कोई भारी CSS Library इस्तेमाल नहीं की है।
    // जैसे ही HTML लोड होगा, बैकग्राउंड इमेज तुरंत दिखाई देगी।

    let timeLeft = 46;
    let coins = 300.00;

    // Timer Logic
    setInterval(() => {
        if(timeLeft > 0) {
            timeLeft--;
            document.getElementById('time').textContent = timeLeft;
        } else {
            timeLeft = 60; // Reset
        }
    }, 1000);

    // Simple Wheel Drawing
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    function drawWheel() {
        const sectors = 10;
        const angle = (Math.PI * 2) / sectors;
        for(let i=0; i<sectors; i++) {
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 180, i * angle, (i+1) * angle);
            ctx.fillStyle = i % 2 === 0 ? "#ffd36a" : "#b38b00";
            ctx.fill();
            ctx.stroke();
            
            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(i * angle + angle/2);
            ctx.fillStyle = "#000";
            ctx.font = "bold 20px Arial";
            ctx.fillText(i, 130, 10);
            ctx.restore();
        }
    }
    drawWheel();

    function startSpin() {
        alert("Spinning Started!");
        // यहाँ आपका स्पिन लॉजिक आएगा
    }
</script>

</body>
</html>
